# Packaging. `npm run dist:mac` builds the dmg and the zip; release.yml signs,
# notarizes and publishes them when the secrets are there.
#
# WHO HOSTS A TERMINAL, AND WHY WINDOWS IS A PREVIEW
# --------------------------------------------------
# Cookrew's headline behaviour is that agents survive a restart, which comes
# from running each terminal inside a multiplexer session. The order is herdr
# (the default, launch-defaults.ts), then tmux, then `direct`: a plain node-pty
# spawn that ends with the app. herdr hosts through `agent attach` under a
# Cookrew-owned config; herdr-host-multiplexer.ts records the measurements and
# why an earlier verdict in this file said the opposite.
#
# Neither herdr nor tmux is in the bundle. Both are looked up on PATH, so a
# machine without them runs `direct` and closing the app ends the agents.
#
# tmux does not exist on Windows, and Cookrew's herdr host has not been run
# there, so `direct` is what the Windows build is taken to run on. That is a real
# product tradeoff, so the build is marked accordingly rather than shipped as if
# it were at parity.

appId: dev.cookrew.app
productName: Cookrew
# Before signing, so the signature covers them: only this app may open a secret.
afterPack: scripts/after-pack-fuses.cjs
copyright: Copyright © 2026 Cookrew

directories:
  output: release
  buildResources: resources

# out/ is what electron-vite emits.
files:
  - out/**/*
  - package.json

asarUnpack:
  # node-pty is native and must be a real file on disk to be spawnable.
  - node_modules/node-pty/**/*

# cookrew://import/@handle/team and its kin — the link a team's page on
# cookrew.dev hands to the app. Parsed in src/main/deep-link.ts; the OS
# registration is claimed at launch (app.setAsDefaultProtocolClient).
# Written into the app as app-update.yml: where a running build looks for the
# next one. The feed is the published release's latest-mac.yml and latest.yml.
publish:
  provider: github
  owner: cookrew
  repo: cookrew-app

protocols:
  name: Cookrew
  schemes:
    - cookrew

# Real files beside the asar, for everything main reads at
# process.resourcesPath. tests/release-signing.test.ts holds this list to main's
# reads: 0.4.0 shipped without four of them, and a downloaded app had no
# `cookrew` in any pane because the copy of a missing file threw.
# The fuses are flipped in the hook below. KEEP RunAsNode ON there: the `cookrew`
# shim runs on this app's binary with ELECTRON_RUN_AS_NODE (src/main/cli-shim.ts).
# With the fuse off that command opens a second instance of the app instead.
extraResources:
  # The Mac's ear for Sous (resources/cr-listen, built at postinstall): a binary
  # main spawns.
  - from: resources/cr-listen/cr-listen
    to: cr-listen
  # The CLI. Main copies it next to the socket, and every pane gets it on PATH.
  - from: cli
    to: cli
  # What a pane runs for a remote-import card and a local import.
  - from: resources/orch-line.mjs
    to: orch-line.mjs
  - from: resources/orch-mirror.mjs
    to: orch-mirror.mjs
  # The dock icon main sets at launch.
  - from: resources/icon.png
    to: icon.png
  # The Magpie agent plugin (resources/magpie): `magpie plugin add <this dir>`
  # puts a Cookrew row on magpie's Agents page (route program, D1b).
  - from: resources/magpie
    to: magpie
  # The Sous agent plugin (resources/magpie-sous): a second row on the Agents
  # page for the model Sous decides with, under its own key and budget (§12 J4).
  - from: resources/magpie-sous
    to: magpie-sous

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  target:
    - dmg
    - zip
  # Gatekeeper opens a download only if it is signed with a Developer ID under
  # the hardened runtime and notarized. Each entitlement is justified in its
  # plist; the helpers and cr-listen get the inherit file.
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  # Notarizes and staples the app before the dmg and zip are built, so both carry
  # the ticket. The login comes from the environment (release.yml); with none
  # electron-builder logs a warning and moves on, so an unsigned build still
  # succeeds.
  notarize: true
  # Without these strings macOS refuses the microphone, the recognizer and the
  # camera outright instead of asking — hold-⌘-to-talk would fail in silence,
  # which is the one way it must not fail.
  extendInfo:
    NSMicrophoneUsageDescription: Cookrew listens while you hold ⌘, so you can talk to your agents.
    NSSpeechRecognitionUsageDescription: Speech is recognized on this Mac, on device; nothing you say leaves it.
    NSCameraUsageDescription: Cookrew shows a camera as a card when you or an agent opens one.

win:
  icon: resources/icon.png
  target:
    # Portable first: an NSIS installer implies a supported product, and the
    # Windows build has a known functional gap (no session persistence).
    - portable
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Named so the tradeoff is visible before installation, not after.
  artifactName: ${productName}-${version}-windows-preview-${arch}.${ext}

linux:
  icon: resources/icon.png
  category: Development
  target:
    - AppImage
