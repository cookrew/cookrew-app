<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: http: https:; media-src 'self' data: blob: http: https:; connect-src 'self' http: https: ws: wss:; worker-src 'self' blob:; frame-src http: https:"
    />
    <!-- maximum-scale=1: iOS auto-zooms the PAGE when focusing an input with a
         small font — xterm's hidden textarea qualifies, so zooming into a
         terminal bounced the whole page zoom in/out through a focus→zoom→
         resize→fit→refocus loop until WebContent died (jetsam, 2026-08-27).
         The canvas has its own zoom; page pinch is not the product surface. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, interactive-widget=resizes-content" />
    <title>Cookrew</title>
    <!-- No third-party fonts: the five families are @font-face rules in
         styles.css over hashed woff2 assets on this origin (perf lane L7). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
