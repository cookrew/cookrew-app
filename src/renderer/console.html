<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- What this page is and the two registry hosts it talks to (src/console/console-config.ts).
         Written when the page is built; nothing is injected when it is served. -->
    <meta name="cookrew-mode" content="console" />
    <meta name="cookrew-api" content="%COOKREW_API_ORIGIN%" />
    <meta name="cookrew-auth" content="%COOKREW_AUTH_ORIGIN%" />
    <!-- The build adds a preconnect to the API host at the end of this head (vite.console.config.ts). -->
    <!-- maximum-scale=1: iOS zooms the page when a small input takes focus, and a terminal's does. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="referrer" content="no-referrer" />
    <title>Cookrew</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4efe4" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/console-main.tsx"></script>
  </body>
</html>
