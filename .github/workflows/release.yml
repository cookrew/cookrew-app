name: Release

# Cookrew had no packaging on any platform, so there was nothing to release
# anywhere. This builds installable artifacts on the runners, which is not a
# convenience: node-pty is a native module, so a Windows binary cannot be
# produced from a Mac at all, and the macOS toolchain on a given developer
# machine may be broken independently of the code.
#
# Manual dispatch, or a version tag. Also on PRs that touch the packaging
# itself: a release pipeline nobody exercises until release day is a pipeline
# that breaks on release day, and the path filter keeps it from building
# installers for every unrelated change.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'electron-builder.yml'
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'resources/entitlements.mac*.plist'
      - 'scripts/mac-signing-plan.mjs'
      - 'scripts/verify-mac-release.sh'

# electron-builder publishes to a GitHub release when it detects a tag build,
# and that path needs a token with release-write access. PR and dispatch runs
# never enter it, which is exactly how the gap survived every green PR run and
# surfaced only on the v0.1.0 tag itself.
#
# It uploads to a DRAFT release, and a person publishes it. That draft is also
# the gate on the Mac build: verification below runs after the upload, so a red
# verify step means the draft holds a build that must not go out.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: cookrew-macos
          # windows-2022, not windows-latest: @electron/node-gyp's VS finder
          # does not recognise the toolchain layout on the current latest image
          # ("Could not find any Visual Studio installation"), while 2022 works.
          - os: windows-2022
            script: dist:win
            artifact: cookrew-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall rebuilds node-pty against Electron's ABI. This is the step
      # that cannot be done cross-platform, and the reason this job exists.
      - run: npm ci

      # Which of the three macOS builds this is. Sees only whether each secret
      # exists; the Windows leg never runs it. Half a set fails the job here.
      - name: Plan macOS signing
        id: signing
        if: runner.os == 'macOS'
        run: node scripts/mac-signing-plan.mjs
        env:
          HAS_CSC_LINK: ${{ secrets.CSC_LINK != '' }}
          HAS_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD != '' }}
          HAS_APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          HAS_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}

      # Correctness is gated by ci.yml. Running the suite again here would
      # block Windows artifacts on 16 known POSIX assumptions in tests, which
      # are a portability debt rather than a statement about the build.
      - name: Build
        if: steps.signing.outputs.sign != 'true'
        run: npm run ${{ matrix.script }}
        env:
          # Only meaningful on tag builds, where electron-builder publishes
          # the artifacts to the release for this tag.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned on purpose: do not pick up whatever the runner's keychain has.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The only step that holds signing material. Kept apart from the plain
      # build because electron-builder acts on these variables wherever it sees
      # them: on the Windows leg it would try to sign an .exe with a macOS
      # certificate.
      - name: Build, sign and notarize
        if: steps.signing.outputs.sign == 'true'
        # Notarization waits on Apple. A stuck queue must not burn a runner for
        # the six-hour default.
        timeout-minutes: 60
        run: |
          if [ "$NOTARIZE_WITH" = api-key ]; then
            # electron-builder tries an Apple ID first and wants APPLE_API_KEY
            # as a path to the .p8, not the key's text.
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY")
          fi
          unset APPLE_API_KEY_P8
          # Forced here and only here: with a bad certificate this run goes red
          # instead of quietly shipping unsigned.
          npm run dist:mac -- -c.forceCodeSigning=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTARIZE_WITH: ${{ steps.signing.outputs.notarize }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Checks the dmg people download, not the tree it was built from.
      - name: Verify the notarized download
        if: steps.signing.outputs.mode == 'notarized'
        # spctl has been seen to sit for minutes behind a busy syspolicyd.
        timeout-minutes: 15
        run: |
          for image in release/*.dmg; do
            bash scripts/verify-mac-release.sh "$image"
          done
          echo "Verified: every dmg holds an app that is signed, notarized and stapled." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Ship the installers, not the unpacked tree.
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14
