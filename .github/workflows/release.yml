name: Release

# Cookrew had no packaging on any platform, so there was nothing to release
# anywhere. This builds installable artifacts on the runners, which is not a
# convenience: node-pty is a native module, so a Windows binary cannot be
# produced from a Mac at all, and the macOS toolchain on a given developer
# machine may be broken independently of the code.
#
# Manual dispatch, or a version tag. Also on PRs that touch the packaging
# itself: a release pipeline nobody exercises until release day is a pipeline
# that breaks on release day, and the path filter keeps it from building
# installers for every unrelated change.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'electron-builder.yml'
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'resources/entitlements.mac*.plist'
      - 'scripts/mac-signing-plan.mjs'
      - 'scripts/verify-mac-release.sh'

# electron-builder publishes to a GitHub release on a tag build, and that path
# needs a token with release-write access. Both build steps pass --publish onTag:
# left to itself on CI it picks onTagOrDraft, and a dispatch from any branch could
# then overwrite the assets of a draft for the same version.
#
# It uploads to a DRAFT release, which no updater can see. The publish job turns
# it into the latest release once every build and the Mac verification are green,
# so a red run leaves a draft that went nowhere. Publishing IS shipping: every
# running app with updates on picks it up within six hours.
#
# To cut a release, from main: `npm version <x.y.z> && git push --follow-tags`.
# A tag with a suffix (v0.5.0-beta.1) publishes as a prerelease, which no updater
# offers.
permissions:
  contents: write

jobs:
  # Nothing is built from a tag that fails its own tests or names another version.
  verify:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: node scripts/release-gate.mjs tag "$GITHUB_REF_NAME"

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  build:
    needs: verify
    # A dispatch or a pull request skips verify, and still has to build.
    if: ${{ !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: cookrew-macos
          # windows-2022, not windows-latest: @electron/node-gyp's VS finder
          # does not recognise the toolchain layout on the current latest image
          # ("Could not find any Visual Studio installation"), while 2022 works.
          - os: windows-2022
            script: dist:win
            artifact: cookrew-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall rebuilds node-pty against Electron's ABI. This is the step
      # that cannot be done cross-platform, and the reason this job exists.
      - run: npm ci

      # build-cr-listen.mjs exits 0 when clang fails, so the app still runs on a
      # broken dev machine, and a missing extraResource is only a warning. A
      # release must not ship with hold-to-talk quietly gone.
      - name: Require cr-listen
        if: runner.os == 'macOS'
        run: test -x resources/cr-listen/cr-listen

      # Which of the three macOS builds this is. Sees only whether each secret
      # exists; the Windows leg never runs it. Half a set fails the job here.
      - name: Plan macOS signing
        id: signing
        if: runner.os == 'macOS'
        run: node scripts/mac-signing-plan.mjs
        env:
          HAS_CSC_LINK: ${{ secrets.CSC_LINK != '' }}
          HAS_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD != '' }}
          HAS_APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          HAS_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}

      # Correctness is gated by ci.yml. Running the suite again here would
      # block Windows artifacts on 16 known POSIX assumptions in tests, which
      # are a portability debt rather than a statement about the build.
      - name: Build
        if: steps.signing.outputs.sign != 'true'
        run: npm run ${{ matrix.script }} -- --publish onTag
        env:
          # Only meaningful on tag builds, where electron-builder publishes
          # the artifacts to the release for this tag.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned on purpose: do not pick up whatever the runner's keychain has.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Its own step, so the build tool and its plugins run with no secrets.
      - name: Bundle
        if: steps.signing.outputs.sign == 'true'
        run: npx electron-vite build

      # The only step that holds signing material. Kept apart from the plain
      # build because electron-builder acts on these variables wherever it sees
      # them: on the Windows leg it would try to sign an .exe with a macOS
      # certificate.
      - name: Build, sign and notarize
        if: steps.signing.outputs.sign == 'true'
        # Notarization waits on Apple. A stuck queue must not burn a runner for
        # the six-hour default.
        timeout-minutes: 60
        run: |
          if [ "$NOTARIZE_WITH" = api-key ]; then
            # electron-builder tries an Apple ID first and wants APPLE_API_KEY
            # as a path to the .p8, not the key's text.
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            trap 'rm -f "$APPLE_API_KEY"' EXIT
            (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY")
          fi
          unset APPLE_API_KEY_P8
          # Forced here and only here: with a bad certificate this run goes red
          # instead of quietly shipping unsigned. npm ci already rebuilt node-pty,
          # so no native build runs beside the certificate.
          npx electron-builder --mac --publish onTag -c.forceCodeSigning=true -c.npmRebuild=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTARIZE_WITH: ${{ steps.signing.outputs.notarize }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Checks the dmg people download, not the tree it was built from.
      - name: Verify the notarized download
        if: steps.signing.outputs.mode == 'notarized'
        # spctl has been seen to sit for minutes behind a busy syspolicyd.
        timeout-minutes: 15
        run: |
          # With assessments off spctl accepts anything and verify would fail
          # every build. Nothing documents what these images ship with.
          status=$(spctl --status 2>&1 || true)
          echo "$status"
          case "$status" in
            *disabled*) sudo spctl --global-enable ;;
          esac
          for image in release/*.dmg; do
            bash scripts/verify-mac-release.sh "$image"
          done
          echo "Verified: every dmg holds an app that is signed, notarized and stapled." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Ship the installers, not the unpacked tree.
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-gate.mjs assets "$GITHUB_REF_NAME"
          if node scripts/release-gate.mjs prerelease "$GITHUB_REF_NAME"; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi

  # THE TWO STATIC SITES, from the same tag as the apps: the console
  # (console.cookrew.dev) and the site (cookrew.dev). After `publish`, because
  # the site names this release's builds and stops if its Mac build is not
  # there to be named. This job runs the repository's code and its
  # dependencies, so it may read the repository and holds no key to the host.
  web:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No install scripts: neither site needs the app's native parts, and no
      # package gets to run code of its own in this job.
      - run: npm ci --ignore-scripts

      - name: Build the console, and hold its first load to the size gate
        run: |
          COOKREW_CONSOLE_VERSION="${GITHUB_REF_NAME#v}" npm run console:build
          npm run console:size

      - name: Build the site for this release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COOKREW_SITE_RELEASE: ${{ github.ref_name }}
          COOKREW_SITE_REQUIRE_RELEASE: '1'
        run: npm run site:build

      - uses: actions/upload-artifact@v4
        with:
          name: web-console
          path: out/console
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: out/site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # UPLOADING THEM IS SHIPPING THEM, so it is off until the owner switches it
  # on (repository variable COOKREW_PAGES_DEPLOY = true, with the two project
  # names and the host's token and account id). A prerelease builds both and
  # uploads neither. This job holds the key and runs none of the repository's
  # code: it downloads what `web` built and hands it to the host's own tool.
  # The console goes first: the site's "Open console" must have somewhere to go.
  web-deploy:
    needs: web
    if: startsWith(github.ref, 'refs/tags/') && vars.COOKREW_PAGES_DEPLOY == 'true' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-console
          path: console

      - uses: actions/download-artifact@v4
        with:
          name: web-site
          path: site

      - name: Upload to the static host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONSOLE_PROJECT: ${{ vars.COOKREW_PAGES_CONSOLE }}
          SITE_PROJECT: ${{ vars.COOKREW_PAGES_SITE }}
        run: |
          test -n "$CONSOLE_PROJECT" && test -n "$SITE_PROJECT"
          test -f console/_headers && test -f console/index.html && test ! -e console/404.html
          test -f site/_headers && test -f site/_redirects && test -f site/404.html
          npx --yes wrangler@4 pages deploy console --project-name="$CONSOLE_PROJECT" --branch=main --commit-hash="$GITHUB_SHA"
          npx --yes wrangler@4 pages deploy site --project-name="$SITE_PROJECT" --branch=main --commit-hash="$GITHUB_SHA"
