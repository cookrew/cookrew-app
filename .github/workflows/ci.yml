name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request makes its running checks stale: cancel them.
# Pushes to main are never cancelled: every commit there keeps its own record.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What does not depend on the OS, once. tsc reads the same files on every
  # runner, and Linux is the strict one (case-sensitive imports), so a check on
  # macOS and Windows as well only repeated this one.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Types only: no native rebuild, and no package runs code of its own.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - name: Guard against pre-rename residue
        run: |
          if grep -rn --exclude-dir=node_modules --exclude-dir=out --exclude-dir=.git \
              --exclude=package-lock.json --exclude=launch-plan.html \
              -i "cava" src cli mobile tests README.md | grep -v "\.cava"; then
            echo "::error::Found leftover pre-rename 'cava' references (see above)"
            exit 1
          fi
          if grep -rn --exclude-dir=node_modules --exclude-dir=out --exclude-dir=.git \
              --exclude=package-lock.json \
              -i "maestri" src cli mobile tests docs README.md package.json; then
            echo "::error::Found 'maestri' references — product copy must stand on its own (see above)"
            exit 1
          fi

  # THE WHOLE SUITE ON EVERY OS, SPLIT THREE WAYS. One runner per OS spent 4-9
  # minutes in `npm test` (1,205 files): vitest --shard hands each runner a
  # third of the files, so every file still runs on every OS, in parallel.
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows gates like any other leg: it builds on windows-2022 and the
        # suite runs there, so a Windows regression must not land silently.
        # windows-2022, not windows-latest: @electron/node-gyp's VS finder does
        # not recognise the toolchain layout on the current latest image
        # ("gyp ERR! find VS — Could not find any Visual Studio installation").
        os: [ubuntu-latest, macos-latest, windows-2022]
        shard: [1, 2, 3]
    name: check (${{ matrix.os }}, ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # On Windows `npm ci` is the slowest step after the tests (~2 min, most
      # of it electron-rebuild compiling node-pty with MSVC), and it ran three
      # times per push once the suite was split. The installed tree is cached,
      # keyed on what decides it (scripts/ci-deps-key.mjs). macOS and Linux
      # install in ~25 s and build cr-listen outside node_modules, so they
      # always install.
      - name: Dependency key
        id: deps
        if: runner.os == 'Windows'
        run: node scripts/ci-deps-key.mjs

      - name: Restore node_modules
        id: nm-cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.deps.outputs.key }}

      # npm ci triggers postinstall (electron-rebuild for node-pty against
      # Electron's ABI), so native toolchains on the runners are exercised here.
      - if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - run: npm test -- --shard=${{ matrix.shard }}/3

      # The app bundle, once per OS.
      - if: matrix.shard == 1
        run: npm run build
